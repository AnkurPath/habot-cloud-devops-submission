[project]
name = "habot-cloud-devops-submission"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["backend", "security", "."]
testpaths = ["backend/tests", "security/tests"]
